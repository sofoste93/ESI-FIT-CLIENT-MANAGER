name: Release native apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            platform: windows
            arch: x64
            native: exe
          - os: ubuntu-latest
            label: Linux x64
            platform: linux
            arch: x64
            native: deb
          - os: macos-15-intel
            label: macOS Intel
            platform: macos
            arch: x64
            native: dmg
          - os: macos-14
            label: macOS Apple Silicon
            platform: macos
            arch: arm64
            native: dmg
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test
        run: mvn -B clean verify

      - name: Build portable Windows app
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/package.ps1 -PackageType app-image

      - name: Check packaged Windows runtime
        if: matrix.platform == 'windows'
        shell: pwsh
        run: '& "target/dist/ESI-FIT-Console/ESI-FIT-Console.exe" --diagnostics; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/package.ps1 -PackageType exe

      - name: Prepare Windows release files
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/dist/ESI-FIT-Console -DestinationPath ESI-FIT-Console-Windows-x64.zip
          Move-Item (Get-ChildItem target/dist/*.exe | Select-Object -First 1) ESI-FIT-Console-Windows-x64.exe

      - name: Build portable Unix app
        if: matrix.platform != 'windows'
        run: bash scripts/package.sh app-image

      - name: Check packaged Linux runtime
        if: matrix.platform == 'linux'
        run: target/dist/ESI-FIT-Console/bin/ESI-FIT-Console --diagnostics

      - name: Check packaged macOS runtime
        if: matrix.platform == 'macos'
        run: target/dist/ESI-FIT-Console.app/Contents/MacOS/ESI-FIT-Console --diagnostics

      - name: Build native Unix installer
        if: matrix.platform != 'windows'
        run: bash scripts/package.sh ${{ matrix.native }}

      - name: Prepare Linux release files
        if: matrix.platform == 'linux'
        run: |
          tar -C target/dist -czf ESI-FIT-Console-Linux-x64.tar.gz ESI-FIT-Console
          mv target/dist/*.deb ESI-FIT-Console-Linux-x64.deb

      - name: Prepare macOS release files
        if: matrix.platform == 'macos'
        run: |
          tar -C target/dist -czf ESI-FIT-Console-macOS-${{ matrix.arch }}.tar.gz ESI-FIT-Console.app
          mv target/dist/*.dmg ESI-FIT-Console-macOS-${{ matrix.arch }}.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: esi-fit-console-${{ matrix.platform }}-${{ matrix.arch }}
          path: ESI-FIT-Console-*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ESI-FIT Console 2.0.0 · Terminal Orbit
          body: |
            ## ESI-FIT is back in the terminal

            A complete restoration of the original team project: live club dashboard, member management, check-in/out, visit archive, search, CSV export and automatic legacy-data recovery.

            Every download includes its own Java runtime. Pick the installer or portable archive for your system — no JRE setup required.

            ### Highlights
            - Full-screen neon terminal control room
            - Durable, private local database
            - Native Windows, Linux, macOS Intel and Apple Silicon builds
            - Built-in diagnostics and tested attendance lifecycle

            **Windows note:** SmartScreen can identify the installer as an unknown publisher until a trusted Authenticode certificate is configured for the project.
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false
